seed: 42
data:
  root: data/processed
  manifest: data/processed/overfit.jsonl
  pairs: data/processed/overfit_pairs.jsonl
  image_size: 224
model:
  channels: 64
  image_pretrained: true
  image_weights_path: weights/resnet18-f37072fd.pth
  text_mode: clip
  text_pretrained: weights/clip-vit-b32-openai.bin
sampler:
  queries: 4
  pairs_per_step: 1
loss:
  lambda_geometry: 1.0
  lambda_swap: 0.1
  margin: 0.2
  temperature: 0.25
train:
  max_steps: 1000
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  warmup_steps: 50
  log_every: 20
  validate_every: 50
  snapshot_every: 200

